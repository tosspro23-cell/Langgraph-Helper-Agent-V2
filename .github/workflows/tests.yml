name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No API key needed: these tests exercise the BM25 retriever and
      # graph routing directly, never calling an LLM. The prebuilt index
      # (data/index/chunks.jsonl) ships in the repo, so no data-prep step
      # is required either.
      - name: Run tests
        run: python -m pytest tests/ -v
